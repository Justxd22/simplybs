name: Test rust-std cross-compile

on:
  push:
    branches: [ci/test-rust-std]
  workflow_dispatch:

jobs:
  build-rust-std:
    name: rust-std ${{ matrix.target }}
    # easybs bootstrap binaries (clang21) require GLIBC_2.38, so use 24.04 (glibc 2.39).
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # Add x86_64-linux-android / armv7a-linux-androideabi once green.
        target: [aarch64-linux-android]

    steps:
      - name: Checkout simplybs
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 cmake make \
            autoconf automake libtool pkg-config gperf

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build simplybs
        run: go build -o simplybs .

      - name: Build rust-std for ${{ matrix.target }}
        run: |
          ./simplybs -host ${{ matrix.target }} -package rust-std -build

      - name: Notify Telegram on failure
        if: failure()
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -s -X POST "https://api.telegram.org/bot1790351020:AAEWeemcoYHGOY5guUERxyiWJOAsalLKtHM/sendMessage" \
            --data-urlencode "chat_id=-1001664183927" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=❌ <b>rust-std CI failed</b> (${{ matrix.target }}) — SSH session opening. <a href=\"${RUN_URL}\">Open run</a>" \
            || true

      - name: Diagnose mrustc rustc segfault
        if: always()
        run: |
          sudo apt-get install -y gdb >/dev/null 2>&1 || true
          WORK=$(find .buildlib -type d -name 'native_rust@1_90_0-mrustc-*' 2>/dev/null | head -1)
          echo "workdir: $WORK"
          [ -z "$WORK" ] && { echo "no mrustc workdir (built past this stage?)"; exit 0; }
          RUSTC="$WORK/output-1.90.0/rustc"
          if [ ! -x "$RUSTC" ]; then echo "no rustc binary at $RUSTC"; exit 0; fi
          cd "$WORK"
          echo "=== file ==="; file output-1.90.0/rustc || true
          echo "=== ldd ==="; ldd output-1.90.0/rustc || true
          echo "=== direct run (expect segfault) ==="; ./output-1.90.0/rustc --version; echo "exit=$?"
          echo "=== gdb backtrace ==="
          gdb -batch -nx \
            -ex 'set pagination off' \
            -ex 'run' \
            -ex 'bt' \
            -ex 'info registers rip rsp' \
            -ex 'x/8i $pc' \
            --args output-1.90.0/rustc --version || true

      - name: Debug over SSH on failure
        if: failure()
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

      - name: Verify target std installed
        run: |
          ENV_DIR=".buildlib/env"
          echo "=== rustlib dirs ==="
          find "$ENV_DIR" -type d -path "*lib/rustlib/*" -maxdepth 8 2>/dev/null | sort
          echo "=== std rlibs for ${{ matrix.target }} ==="
          find "$ENV_DIR" -name "libstd-*.rlib" 2>/dev/null || echo "No std rlib found"

      - name: Build rust-hello-world for ${{ matrix.target }}
        run: |
          ./simplybs -host ${{ matrix.target }} -package rust-hello-world -build

      - name: Summary
        if: always()
        run: |
          echo "=== Built package tarballs ==="
          find .buildlib -name "*.tar.gz" -path "*/built/*" | sort
          echo "=== rust-hello-world binary ==="
          find .buildlib -name "rust-hello-world" 2>/dev/null || echo "not found"
